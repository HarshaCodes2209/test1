<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slouch Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: #fff;
    }
    video, canvas {
      transform: scaleX(-1);
      border-radius: 10px;
    }
    #warning {
      margin-top: 15px;
      font-size: 24px;
      color: #00ff88;
    }
    .slouch {
      color: #ff4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>🪑 Slouch Detector</h1>
  <p>Sit straight. I’m watching 👀</p>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="warning">Posture looks good 👍</div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const warning = document.getElementById("warning");

    const pose = new Pose({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    pose.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await pose.send({ image: video });
      },
      width: 640,
      height: 480,
    });
    camera.start();

    function onResults(results) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (!results.poseLandmarks) return;

      drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
        color: "#00ff88",
        lineWidth: 4,
      });
      drawLandmarks(ctx, results.poseLandmarks, {
        color: "#ffcc00",
        lineWidth: 2,
      });

      checkSlouch(results.poseLandmarks);
    }

    function checkSlouch(landmarks) {
      const nose = landmarks[0];
      const leftShoulder = landmarks[11];
      const rightShoulder = landmarks[12];

      const shoulderMidX = (leftShoulder.x + rightShoulder.x) / 2;
      const shoulderMidY = (leftShoulder.y + rightShoulder.y) / 2;

      const forwardHeadDistance = nose.x - shoulderMidX;
      const downwardHeadDistance = nose.y - shoulderMidY;

      const SLOUCH_X_THRESHOLD = 0.08;
      const SLOUCH_Y_THRESHOLD = -0.12;

      if (
        Math.abs(forwardHeadDistance) > SLOUCH_X_THRESHOLD ||
        downwardHeadDistance > SLOUCH_Y_THRESHOLD
      ) {
        warning.textContent = "⚠️ Straighten up! You’re slouching.";
        warning.classList.add("slouch");
      } else {
        warning.textContent = "Posture looks good 👍";
        warning.classList.remove("slouch");
      }
    }
  </script>
</body>
</html>
